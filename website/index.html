<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="index_style.css">
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="background-layer"></div>

    <script type="module">
        if (window.innerWidth < 800 || window.innerHeight < 600 || 'ontouchstart' in window) { 
            window.location.href = '/errors/desktop_only.html'
        }
    </script>

    <div class="content-wrapper">
        <img src="img/HumansVsMarketNoBackround - Diff.png" class="hero-image" alt="Humans vs Market">

        <h1 class="main-title">
            <span class="text-orange">HUMAN BRAIN</span>
            <span class="text-yellow"> VS </span>
            <span class="text-green">STOCK MARKET</span>
        </h1>

        <div class="features-section">
            <div class="feature-card">
                <img class="feature-icon clock" src="img/PixelClock.png" alt="Clock">
                <p>3-5<br>min</p>
            </div>
            
            <div class="feature-card">
                <img class="feature-icon chart" src="img/PixelChart.png" alt="Chart">
                <p>Fresh new<br>data everyday</p>
            </div>

            <div class="feature-card">
                <img class="feature-icon trophy" src="img/PixelTrophy.png" alt="Trophy">
                <p>Compete<br>against others</p>
            </div>
        </div>

        <div class="divider-line"></div>

        <div class="body-text">
            <p>
                Your interactions with the game will be recorded for research purposes.
            </p>
        </div>

        <div class="action-button-container">
            <button class="game-button">TO GAME</button>
            <button class="tut-button">TO TUTORIAL</button>
        </div>

    </div>

    <script type="module">
        const gameButton = document.querySelector('.game-button')
        gameButton.addEventListener('click', () => {
            localStorage.setItem('players current intent', 'to game')
            window.location.href = 'game/game_loop.html'
        })

        const tutButton = document.querySelector('.game-button')
        tutButton.addEventListener('click', () => {
            localStorage.setItem('players current intent', 'to tut')
            window.location.href = 'game/game_loop.html'
        })

    </script>
</body>
</html>
