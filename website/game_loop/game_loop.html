<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../globals.css">
    <link rel="stylesheet" href="game_loop_style.css">

    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div id="start-text"></div>

    <div id="menu-group">
        <button id="start-button" class="menu-btn hidden">START</button>
        <button id="redo-tut-button" class="menu-btn hidden">REDO TUTORIAL</button>
        <button id="fastforward-button" class="menu-btn hidden">SKIP TUTORIAL</button>
    </div>

    <div id="countdown-number" class="hidden"></div>

    <div id="overlay" class="active"></div>
    
    <div id="tutorial-tooltip" class="hidden"></div>

    <div class="main-loop">

        <header class="end-of-data-texts hidden">
            <h1 class="main-title">YOU FINISHED</h1>
            <h2 class="sub-title">Explore the chart and view your stats. Press the corner button when done.</h2>
        </header>
        
        <div class="panels-container">
            <div class="left-panel">
                <div class="chart-rectangle"></div>
                
                <div class="button-row">
                    <button class="buy-button">UP</button>
                    <button class="close-button ghost-hidden">TAKE PROFIT</button>
                    <button class="sell-button">DOWN</button>
                </div>
            </div>
    
            <div class="right-panel">
                <div class="profit-card realised-profit">
                    <div class="header-text">Realised Profit</div>
                    <div class="amount-text">$0.00</div>
                </div>
    
                <div class="profit-card unrealised-profit">
                    <div class="header-text">Unrealised Profit</div>
                    <div class="amount-text">$0.00</div>
                </div>
    
                <div class="trade-stats-card hidden">
                    <div class="header-section">
                        <span class="header-text">Trade Stats</span>
                    </div>
                    
                    <div class="body-section">
                        <div class="stat-row">
                            <span class="text">Net Profit</span>
                            <span class="amount" id="stats-net-profit">$676</span>
                        </div>
                
                        <div class="stat-row">
                            <span class="text">Number of Trades</span>
                            <span class="amount" id="stats-num-trades">67</span>
                        </div>
                
                        <div class="stat-row">
                            <span class="text">Win Rate</span>
                            <span class="amount" id="stats-win-rate">67%</span>
                        </div>
                
                        <div class="stat-row">
                            <span class="text">Buy Win Rate</span>
                            <span class="amount" id="stats-buy-win-rate">76%</span>
                        </div>
                
                        <div class="stat-row">
                            <span class="text">Sell Win Rate</span>
                            <span class="amount" id="stats-sell-win-rate">50%</span>
                        </div>
                    </div>
                </div>
    
                <div class="trade-history">
                    <div class="header-rectangle">
                        <div class="header-text">Trade History</div>
                    </div>
    
                    <div class="trade-history-content">
                        <div class="subheading">
                            <div class="col-num">Number</div>
                            <div class="col-type">Type</div>
                            <div class="col-outcome">Outcome</div>
                        </div>
                        
                        <ul class="list"></ul>
                    </div>
                </div>
    
                <button class="finished-looking-button hidden">FINISHED LOOKING</button>
    
            </div>
        </div>
    </div>

    <div id="error-toast" class="error-toast">
        <span class="error-text">An error has occurred</span>
    </div>

    <script type="module" src="../game_loop_deployment.js"></script>
</body>
</html>
