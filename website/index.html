
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="main-loop" >
        <div class="chart-rectangle" ></div>

        <button class="sell-button" >
            <div class="sell-button-rectangle" ></div>
            <div class="sell-text" >SELL</div>
        </button>
        
        <button class="buy-button" >
            <div class="buy-button-rectangle" ></div>
            <div class="buy-text" >BUY</div>
        </button>

        <button class="close-button" >
            <div class="close-button-rectangle" ></div>
            <div class="close-text" >CLOSE</div>
        </button>

        <div class="trade-history" >
            <div class="trade-history-rectangle" ></div>
            <div class="header-rectangle" ></div>
            <div class="header-text" >Trade History</div>
        </div>

        <div class="realised-profit" >
            <div class="realised-profit-rectangle" ></div>
            <div class="header-text" >Realised Profit</div>
            <div class="amount-text" ></div>
        </div>

        <div class="unrealised-profit" >
            <div class="rectangle" ></div>
            <div class="header-text" >Unrealised Profit</div>
            <div class="amount-text" ></div>
        </div>
    </div>

    <script type="module" src="deployment.js"></script>
</body>
</html>
