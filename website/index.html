<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="index_style.css">
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="background-layer"></div>

    <script type="module">
        if (window.innerWidth < 800 || window.innerHeight < 600 || 'ontouchstart' in window) { 
            window.location.href = '/errors/desktop_only.html'
        }
    </script>

    <div class="content-wrapper">
        <img src="img/HumansVsMarketNoBackround - Diff.png" class="hero-image" alt="Humans vs Market">

        <h1 class="main-title">
            <span class="text-orange">HUMAN BRAIN</span>
            <span class="text-yellow"> VS </span>
            <span class="text-green">STOCK MARKET</span>
        </h1>

        <div class="features-section">
            <div class="feature-card">
                <img class="feature-icon clock" src="img/PixelClock.png" alt="Clock">
                <p>7-10<br>min</p>
            </div>
            
            <div class="feature-card">
                <img class="feature-icon chart" src="img/PixelChart.png" alt="Chart">
                <p>Trade on<br>historical data</p>
            </div>

            <div class="feature-card">
                <img class="feature-icon trophy" src="img/PixelTrophy.png" alt="Trophy">
                <p>Compete<br>against others</p>
            </div>
        </div>

        <div class="divider-line"></div>

        <div class="body-text">
            <p>
                You’ll complete a quick survey and complete a brief tutorial.<br>
                Then, you'll jump right into the main task: trading to make as<br>
                much virtual profit as possible!
            </p>
        </div>

        <button class="next-button">CLICK TO START</button>
    </div>

    <script type="module">
        const nextButton = document.querySelector('.next-button')
        nextButton.addEventListener('click', () => {
            window.location.href = 'survey/survey.html'
        })
    </script>
</body>
</html>
