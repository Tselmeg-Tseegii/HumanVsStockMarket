<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trading Statistics</title>
    <link rel="stylesheet" href="../globals.css">
    <link rel="stylesheet" href="ending-stats-style.css">

    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <main class="ending-screen">

        <header class="title-section">
            <h1 class="main-title">THANK YOU FOR PARTICIPATING IN THE STUDY</h1>
            <h2 class="sub-title">Here is your ranking against others who have played</h2>
        </header>
        
        <section class="basic-statistics">
            <div class="stat-card num-players">
                <span class="text">Num Players So Far</span>
                <span class="amount">-</span>
            </div>

            <div class="stat-card max">
                <span class="text">Best Trade of all</span>
                <span class="amount">-</span>
            </div>

            <div class="stat-card min">
                <span class="text">Worst Trade of all</span>
                <span class="amount">-</span>
            </div>

            <div class="stat-card ranking">
                <span class="text">Your percentile</span>
                <span class="amount">-</span>
            </div>
        </section>

        <section class="net-profit-distribution">
            <div id="histogram-placeholder" class="empty-state-text">
                No histogram data available
            </div>
            <canvas id="profitHistogramCanvas" class="hidden"></canvas>
        </section>

    </main>

    <div id="error-toast" class="error-toast">
        <span class="error-text">An error has occurred</span>
    </div>

    <script type="module" src="../ending_deployment.js"></script>
</body>
</html>
