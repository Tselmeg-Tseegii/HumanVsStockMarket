<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trading Statistics</title>
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="ending-stats-style.css">
</head>
<body>
    <main class="ending-screen">

        <header class="title-section">
            <h1 class="main-title">YOU FINISHED</h1>
            <h2 class="sub-title">Here are your statistics</h2>
        </header>
        
        <section class="basic-statistics">
            <div class="stat-card net-profit">
                <span class="text">Net Profit</span>
                <span class="amount">$676</span>
            </div>

            <div class="stat-card num-trades">
                <span class="text">Number of Trades</span>
                <span class="amount">67</span>
            </div>

            <div class="stat-card overall-win-rate">
                <span class="text">Win Rate</span>
                <span class="amount">67%</span>
            </div>

            <div class="stat-card buy-win-rate">
                <span class="text">Buy Win Rate</span>
                <span class="amount">76%</span>
            </div>

            <div class="stat-card sell-win-rate">
                <span class="text">Sell Win Rate</span>
                <span class="amount">50%</span>
            </div>
        </section>

        <section class="net-profit-distribution">
            <div class="histogram-placeholder">
                Histogram Data
            </div>
        </section>

    </main>
</body>
</html>
